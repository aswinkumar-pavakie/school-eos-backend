name: Keep Render services awake

# Render's free tier puts a web service to sleep after ~15 minutes with no
# inbound traffic; the first request after that has to wait for a cold boot
# (30-60s, sometimes rejected outright by Render's own edge with a 429 while
# the container is still starting -- see school-eos-messaging's
# CoreIntegrationService for the retry logic that absorbs that specific
# failure mode). Retrying around a cold start only helps once the request is
# already in flight; the actual fix is never letting either service go to
# sleep in the first place. This workflow does that: a real ping every 10
# minutes, comfortably under Render's own idle threshold, running on
# GitHub's infrastructure so it works whether or not anyone has this repo
# open, unlike a session-scoped scheduled task.
on:
  schedule:
    # Every 10 minutes -- Render's free tier sleeps at ~15 minutes idle, so
    # this always lands well inside that window. GitHub may delay a
    # scheduled run under load; 10 minutes leaves real margin either way.
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # lets you trigger a manual run from the Actions tab to test it immediately

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping school-eos-backend
        run: |
          curl -s -o /dev/null -w "backend: HTTP %{http_code} in %{time_total}s\n" \
            --max-time 90 "https://school-eos-backend.onrender.com/" || true
      - name: Ping school-eos-messaging
        run: |
          curl -s -o /dev/null -w "messaging: HTTP %{http_code} in %{time_total}s\n" \
            --max-time 90 "https://school-eos-messaging.onrender.com/health/live" || true
